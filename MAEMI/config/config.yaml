defaults:
  - _self_
  - device: default 

patches:
    modalities: ['tauPET']  # Output folder will be in the form of out_dir/mod1_mod2
    spacing: [1.5, 1.5, 1.5]
    min_size_mm: [False, False, False]
    crop: 'before'  # crop patch before or after intensity value manipulations
    clip_before_norm: [0.0, False]  # [clip_min, clip_max] intensity values
    rescale: [[0, 5, 0, 1]]  # [[in_low, in_high, out_low, out_high]]
    normalise: False
    bias_correction: []

model:
    model: 'mae_vit_base'
    ignore_abnormal_tau_training: False
    ignore_abnormal_tau_inf: True
    tau_threshold: 1.3
    ignore_abnormal_amyloid: False
    cerebellum_mask: 'lpba40cerebellum.nii'  # Mask to use if ignoring abnormal amyloid
    epochs: 2500
    in_chans: 1
    batch_size: 4
    accum_iter: 1 #Accumulate gradient iterations (for increasing the effective batch size under memory constraints)
    patch_size: [4, 4, 4]
    mask_ratio: 0.95
    norm_pix_loss: False
    weight_decay: 0.05
    lr: 0.0001
    blr: 0.00015 #base learning rate: absolute_lr = base_lr * total_batch_size / 256
    min_lr: 0.00000001
    warmup_epochs: 80
    seed: 0
    resume: False  # Path to checkpoint to resume training from

    load_partial: ['blocks']
    freeze_partial: False
    load_optim: True
    start_epoch: 0
    distributed: False
    num_workers: 4
    dist_on_itp: False #url used to set up distributed training
    pin_mem: True #Pin CPU memory in DataLoader for more efficient (sometimes) transfer to GPU
    device: 'cuda:0'
    force_not_distributed: True
    save_every: 200

data:
    general:
        split_file: train_val_test_UAD.csv
        is_external_dataset: false
        patch_file: 'patches.h5'
        no_norm_patch_file: 'no_norm_patches.h5'
        ignore_abnormal_amyloid: ${model.ignore_abnormal_amyloid}
        schaefer_atlas: 'schaefer2018_400Parcels_7Networks_order_FSLMNI152_1mm.nii'
        cerebellum_mask: ${model.cerebellum_mask}  # Mask to use if ignoring abnormal amyloid
        shape: [72, 72, 72]
        margin: [[0, 0], [0, 0], [0, 0]]
        channel_first: True
        scale: False
        one_hot: False
        max_value: False  # 1.5
        min_value: False  # 0.001
    train:
        training: True
        augment:
            flip: False
            rot: 15
            zoom: False # [0.9, 1.1]
            offset: False #[-0.025, 0.025]
            noise: 
                type: gaussian
                variance: [0.0, 0.05]
            blur: False
    inference:
        stride: [20, 20, 20]
        min_filter_size: [3, 3]
        repeat: 6
        stitching: mean