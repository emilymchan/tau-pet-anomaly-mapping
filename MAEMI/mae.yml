
name: mae

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.9.6
  - pip

  # Scientific computing and data processing
  - numpy=1.20.3
  - pandas=1.4.2
  - scipy=1.7.3
  - scikit-learn=1.0.2
  - h5py=3.6.0
  - matplotlib=3.5.1
  - pyyaml=6.0
  - openpyxl
  - tqdm=4.64.0

  # Experiment tracking and notebooks
  - tensorboard=2.9.0
  - ipykernel

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - timm==0.3.2

      # Configuration
      - hydra-core==1.3.2
      - omegaconf==2.3.0

      # Medical imaging
      - SimpleITK==2.3.1

      # Image processing and visualisation
      - Pillow==9.1.0
      - imageio
      - moviepy
      - pygifsicle
